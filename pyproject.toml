[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "port-who"
version = "1.0.0"
description = "Beautiful Port Inspector TUI — see who's using your ports"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Port Who Contributors" }]
keywords = ["port", "process", "tui", "network", "inspector", "cli"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Networking",
    "Topic :: Utilities",
]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "textual>=0.40.0",
    "psutil>=5.9.0",
]

[project.urls]
Homepage = "https://github.com/port-who/port-who"
Repository = "https://github.com/port-who/port-who"
Issues = "https://github.com/port-who/port-who/issues"

[project.scripts]
port-who = "port_who.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.4.0",
    "pip-audit>=2.0",
]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "C4", "PT"]
ignore = ["S603", "S607", "S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["port_who"]
omit = ["src/port_who/tui/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__",
    "if TYPE_CHECKING",
]
